version: '3.9'

services:
  # ===== API Gateway =====
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: gina-ai-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://gina:gina_secret@postgres:5432/gina_db
    depends_on:
      - redis
      - postgres
    networks:
      - gina-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Orchestrator Service =====
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: gina-orchestrator
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - gina-network
    restart: unless-stopped

  # ===== Frontend Web =====
  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: gina-web
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://api-gateway:3000
    networks:
      - gina-network
    restart: unless-stopped

  # ===== Redis Cache =====
  redis:
    image: redis:7-alpine
    container_name: gina-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gina-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-gina_redis_secret}

  # ===== PostgreSQL Database =====
  postgres:
    image: postgres:16-alpine
    container_name: gina-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gina
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gina_secret}
      POSTGRES_DB: gina_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gina-network
    restart: unless-stopped

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: gina-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
      - web
    networks:
      - gina-network
    restart: unless-stopped

  # ===== Prometheus Monitoring =====
  prometheus:
    image: prom/prometheus:latest
    container_name: gina-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - gina-network
    restart: unless-stopped

  # ===== Grafana Dashboard =====
  grafana:
    image: grafana/grafana:latest
    container_name: gina-grafana
    ports:
      - "3200:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - gina-network
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  grafana-data:

networks:
  gina-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
